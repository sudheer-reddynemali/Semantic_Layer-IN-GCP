[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falkordb-ontology-poc"
version = "0.1.0"
description = "Enterprise KPI ontology loader and validator for FalkorDB"
requires-python = ">=3.10"
dependencies = [
    "redis==5.2.1",
    "google-cloud-bigquery>=3.30,<4",
]

[project.scripts]
ontology-ingest = "load_sample_data:main"
ontology-validate = "validate_graph:main"
bigquery-falkordb-ingest = "bigquery_falkordb_ingestion.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts", "bigquery_falkordb_ingestion" = "bigquery_falkordb_ingestion"}
py-modules = [
    "export_bigquery_csv",
    "export_sample_csv",
    "fact_graph",
    "falkor_client",
    "ingest_records",
    "kpi_measures",
    "load_sample_data",
    "normalize",
    "ontology_csv",
    "read_bigquery",
    "record_io",
    "validate_graph",
    "validate_records",
    "vocabulary_values",
]
packages = ["bigquery_falkordb_ingestion"]

[tool.setuptools.package-data]
bigquery_falkordb_ingestion = [
    "config.json",
    ".env.example",
    "README.md",
    "requirements.txt",
    "ontology/*.csv",
]
